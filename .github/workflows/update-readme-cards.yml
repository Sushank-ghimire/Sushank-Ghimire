name: Update README cards

on:
  schedule:
    - cron: "0 */12 * * *"   # Runs every 12 hours (00:00 and 12:00 UTC)
  push:
    paths:
      - ".github/workflows/update-readme-cards.yml"
  workflow_dispatch:        
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Sushank-ghimire&show_icons=true&hide_border=true&bg_color=0D1117&title_color=6C63FF&icon_color=F59E0B&text_color=ffffff&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Sushank-ghimire&layout=compact&hide_border=true&bg_color=0D1117&title_color=6C63FF&text_color=ffffff&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Sushank-ghimire&theme=tokyonight&hide_border=true&background=0D1117&ring=6C63FF&fire=F59E0B&currStreakLabel=6C63FF
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy card
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Sushank-ghimire
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # Trophy generation is less stable; don't fail the whole run if it hiccups

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh README cards" || exit 0
          git push
